<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rota">
<title>Rota – III SDH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img class="logo" src="logo.png" alt="" width="46" height="46">
    <div class="brand">
      <span class="app">Rota</span>
      <span class="team" id="teamName"></span>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Odśwież dane" title="Odśwież">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="demo-bar" id="demoBar" hidden>Tryb demo – przykładowe dane</div>
</header>

<main id="view" tabindex="-1"><div class="loading">Ładowanie…</div></main>

<nav class="tabs" id="tabs" hidden>
  <a href="#rozkazy" data-tab="rozkazy"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg><span>Rozkazy</span></a>
  <a href="#konspekty" data-tab="konspekty"><svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-5a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h5z"/></svg><span>Konspekty</span></a>
  <a href="#sprawnosci" data-tab="sprawnosci"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z"/></svg><span>Sprawności</span></a>
  <a href="#stopnie" data-tab="stopnie"><svg viewBox="0 0 24 24"><path d="M5 20V9l7-5 7 5v11M5 14l7-5 7 5M5 19l7-5 7 5"/></svg><span>Stopnie</span></a>
  <a href="#lista" data-tab="lista"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg><span>Harcerze</span></a>
  <a href="#wiecej" data-tab="wiecej"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Więcej</span></a>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" data-close aria-label="Zamknij">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="fileInput" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
